# Important Notes:
# Version-specific properties (minecraft_version, fabric_version, neoforge_version, etc.)
# are loaded from versions/<mc_version>.properties automatically.
# To target a different MC version: set mc_version below and create versions/<ver>.properties.
# Git convention: one branch per game version (e.g. 1.21.1, 1.21.4) branching from `develop`.

# Project
version=1.1.0
group=com.drunkencod.create_nerfed_drills
java_version=21

# Active Minecraft version (must match a file in versions/)
mc_version=1.21.1

# Common mod metadata
mod_name=Create: Nerfed Drills
mod_author=Sv443
mod_organization=Drunken Cod
mod_id=create_nerfed_drills
license=LGPL-3.0-or-later
description=Nerfs Mechanical Drills on Contraptions so mining doesn't become trivial with Create installed.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Other
game_jvm_args=-XX:+UseZGC -XX:+ZGenerational
